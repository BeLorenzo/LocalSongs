name: lettore_musicale
description: "A modern local music player Flutter app."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_picker: ^11.0.3
  permission_handler: 11.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  http: ^1.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
