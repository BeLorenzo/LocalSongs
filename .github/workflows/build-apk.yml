name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compila APK Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK 27 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          chmod +x android/gradlew

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Installa dipendenze Flutter
        run: flutter pub get

      - name: Compila APK Release
        run: flutter build apk --release

      - name: Carica APK come Artifact di build
        uses: actions/upload-artifact@v4
        with:
          name: LocalSongs-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Estrai note di rilascio da Git
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 1. Prova a estrarre il messaggio annotato del tag
          NOTES=$(git tag -l --format='%(contents)' ${{ github.ref_name }} | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          # 2. Se vuoto, prendi il commit message dell'ultimo commit
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=%B)
          fi

          # Scrivi nell'output multiriga per GitHub Actions
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Crea GitHub Release (solo su Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
